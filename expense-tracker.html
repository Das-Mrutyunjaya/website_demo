<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MJ Expense - Daily Tracker</title>
  
  <!-- Apple Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MJ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090a0f">
  <link rel="manifest" href="./manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for iOS-style crisp charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iosBgDark: '#07080c',
            iosCardDark: 'rgba(23, 25, 35, 0.72)',
            iosCardBorder: 'rgba(255, 255, 255, 0.08)',
            iosAccent: '#0A84FF',
            iosGreen: '#30D158',
            iosOrange: '#FF9F0A',
            iosPurple: '#BF5AF2',
            iosRed: '#FF453A',
            iosPink: '#FF375F',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          },
          boxShadow: {
            'glow-accent': '0 8px 30px rgba(10, 132, 255, 0.35)',
            'glow-card': '0 10px 40px -10px rgba(0,0,0,0.6)',
          }
        }
      }
    }
  </script>

  <style>
    /* iOS Safe Area & Interaction Polish */
    :root {
      --sat: env(safe-area-inset-top, 47px);
      --sab: env(safe-area-inset-bottom, 34px);
    }
    
    body {
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 22%),
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.18), transparent 26%),
        linear-gradient(180deg, #07080c 0%, #0a0d14 100%);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
      pointer-events: none;
    }

    /* Blur & Glassmorphism */
    .glass-nav {
      background: rgba(14, 16, 24, 0.82);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-header {
      background: rgba(7, 8, 12, 0.78);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(28, 31, 46, 0.82) 0%, rgba(18, 20, 30, 0.72) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 18px 45px rgba(10, 14, 23, 0.45);
    }
    .glass-card-subtle {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .metric-pill {
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Dynamic Island spacer simulation for preview */
    .dynamic-island-pill {
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    /* Modal Sheet Slide */
    .sheet-transition {
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet-hidden {
      transform: translateY(105%);
    }

    /* Active Tap Ripple simulation */
    .tap-scale {
      transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.12s;
    }
    .tap-scale:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden bg-iosBgDark text-white">

<!-- iPhone Dynamic Island & Status Area Indicator (Visible on desktop/preview) -->
  <div class="fixed top-0 left-0 right-0 z-50 pointer-events-none flex flex-col items-center pt-2 select-none" style="padding-top: max(env(safe-area-inset-top), 8px);">
    <div class="w-32 h-7 bg-black rounded-full dynamic-island-pill border border-neutral-800/80 hidden sm:flex items-center justify-between px-3">
      <div class="w-2 h-2 rounded-full bg-neutral-900 border border-neutral-700"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/80 animate-pulse"></div>
    </div>
  </div>

  <!-- Header -->
  <header class="glass-header z-40 px-4 pt-8 pb-3 flex items-center justify-between transition-all" style="padding-top: max(var(--sat), 18px);">
    <div class="flex items-center gap-3">
      <div class="relative">
        <div class="w-11 h-11 rounded-[16px] bg-gradient-to-tr from-blue-600 via-indigo-500 to-violet-500 flex items-center justify-center shadow-[0_12px_30px_rgba(96,165,250,0.32)] text-white font-black text-[11px] tracking-[0.16em] ring-1 ring-white/10">MJ</div>
        <div class="absolute -bottom-1 -right-1 h-3 w-3 rounded-full border-2 border-[#0d1118] bg-emerald-400 shadow-[0_0_16px_rgba(52,211,153,0.7)]"></div>
      </div>
      <div>
        <p class="text-[9px] text-neutral-400 font-medium tracking-[0.24em] uppercase">Daily Tracker</p>
        <h1 class="text-lg font-bold tracking-[-0.04em] text-white flex items-center gap-1.5">
          <span>MJ Wallet</span>
          <span class="text-[9px] px-1.5 py-0.5 rounded-md bg-blue-500/15 text-blue-300 font-semibold border border-blue-500/25">MJ</span>
        </h1>
      </div>
    </div>

    <!-- Currency & Quick Settings Toggle -->
    <div class="flex items-center gap-2">
      <button id="currency-toggle" class="tap-scale px-2.5 py-1.5 rounded-full glass-card-subtle text-xs font-semibold text-neutral-200 border border-white/10 flex items-center gap-1">
        <span id="current-currency-symbol">₹</span>
        <span id="current-currency-code" class="text-neutral-400">INR</span>
      </button>
      <button onclick="openSettingsModal()" class="tap-scale w-8 h-8 rounded-full glass-card-subtle flex items-center justify-center border border-white/10 text-neutral-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Scrollable App Content -->
  <main class="flex-1 overflow-y-auto px-4 pb-28 pt-3 space-y-4 max-w-lg mx-auto w-full">
    
    <!-- Timeframe Filter Pill (Copilot / Apple Style) -->
    <div class="flex p-1 rounded-2xl bg-neutral-900/90 border border-white/5 backdrop-blur-xl shadow-xl shadow-blue-500/5">
      <button onclick="setTimeframe('today')" id="tab-today" class="flex-1 py-1.5 text-[10px] font-semibold rounded-xl transition-all duration-200 text-neutral-400">Today</button>
      <button onclick="setTimeframe('week')" id="tab-week" class="flex-1 py-1.5 text-[10px] font-semibold rounded-xl transition-all duration-200 bg-white/10 text-white shadow-sm">Week</button>
      <button onclick="setTimeframe('month')" id="tab-month" class="flex-1 py-1.5 text-[10px] font-semibold rounded-xl transition-all duration-200 text-neutral-400">Month</button>
      <button onclick="setTimeframe('year')" id="tab-year" class="flex-1 py-1.5 text-[10px] font-semibold rounded-xl transition-all duration-200 text-neutral-400">Year</button>
    </div>

    <div class="glass-card-subtle rounded-2xl p-3">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-neutral-300">Date Filter</span>
        <button onclick="clearDateFilter()" class="text-[10px] text-neutral-400">Clear</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <label class="block text-[10px] text-neutral-400">
          <span class="mb-1 block">From</span>
          <input id="filter-from-date" type="date" onchange="applyDateFilter()" class="w-full bg-neutral-900 border border-white/10 rounded-lg px-2 py-1.5 text-white text-[11px] focus:outline-none focus:border-blue-500" />
        </label>
        <label class="block text-[10px] text-neutral-400">
          <span class="mb-1 block">To</span>
          <input id="filter-to-date" type="date" onchange="applyDateFilter()" class="w-full bg-neutral-900 border border-white/10 rounded-lg px-2 py-1.5 text-white text-[11px] focus:outline-none focus:border-blue-500" />
        </label>
      </div>
    </div>

    <!-- Hero Glass Balance Card -->
    <div class="glass-card rounded-[30px] p-5 relative overflow-hidden shadow-glow-card">
      <div class="absolute -right-12 -top-12 w-44 h-44 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -left-12 -bottom-12 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute inset-x-0 top-0 h-20 bg-gradient-to-r from-blue-500/10 via-indigo-500/8 to-purple-500/10"></div>

      <div class="flex justify-between items-start mb-2 relative z-10">
        <span class="text-xs font-semibold tracking-wider uppercase text-neutral-400">Total Spent</span>
        <span id="hero-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
          Budget on Track
        </span>
      </div>

      <div class="flex items-baseline space-x-1.5 mb-4 relative z-10">
        <span class="text-2xl font-light text-neutral-400" id="hero-currency-symbol">₹</span>
        <h2 class="text-4xl font-extrabold tracking-tight text-white drop-shadow-[0_0_25px_rgba(96,165,250,0.35)]" id="hero-total-spent">0.00</h2>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/10 relative z-10">
        <div class="metric-pill rounded-2xl p-2.5">
          <p class="text-[11px] text-neutral-400 uppercase tracking-wider font-medium">Average</p>
          <p class="text-base font-bold text-neutral-200 mt-1" id="hero-daily-avg">₹0</p>
        </div>
        <div class="metric-pill rounded-2xl p-2.5">
          <p class="text-[11px] text-neutral-400 uppercase tracking-wider font-medium">Remaining</p>
          <p class="text-base font-bold text-neutral-200 mt-1" id="hero-remaining-budget">₹45,000</p>
        </div>
      </div>

      <div class="mt-3.5 space-y-1.5 relative z-10">
        <div class="flex justify-between text-[11px] text-neutral-400">
          <span>Spent vs Budget</span>
          <span id="budget-percentage" class="font-medium text-neutral-300">0%</span>
        </div>
        <div class="h-2.5 w-full bg-neutral-800/80 rounded-full overflow-hidden p-[1px]">
          <div id="budget-progress-bar" class="h-full bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 rounded-full transition-all duration-500 shadow-[0_0_20px_rgba(96,165,250,0.7)]" style="width: 25%"></div>
        </div>
      </div>
    </div>

    <!-- Quick Action Bar -->
    <div class="grid grid-cols-3 gap-2">
      <button onclick="openAddModalWithCategory('Food & Dining')" class="tap-scale glass-card-subtle p-3 rounded-2xl flex flex-col items-center justify-center border border-white/5 text-center">
        <span class="text-xl mb-1">🍔</span>
        <span class="text-[11px] font-medium text-neutral-300">Quick Food</span>
      </button>
      <button onclick="openAddModalWithCategory('Transport')" class="tap-scale glass-card-subtle p-3 rounded-2xl flex flex-col items-center justify-center border border-white/5 text-center">
        <span class="text-xl mb-1">🚕</span>
        <span class="text-[11px] font-medium text-neutral-300">Transit / Fuel</span>
      </button>
      <button onclick="openAddModalWithCategory('Shopping')" class="tap-scale glass-card-subtle p-3 rounded-2xl flex flex-col items-center justify-center border border-white/5 text-center">
        <span class="text-xl mb-1">🛍️</span>
        <span class="text-[11px] font-medium text-neutral-300">Shopping</span>
      </button>
    </div>

    <!-- Analytics & Chart Section -->
    <div class="glass-card rounded-3xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-neutral-200 tracking-tight">Spending Analytics</h3>
        <div class="flex gap-1.5 bg-neutral-900/80 p-0.5 rounded-lg border border-white/5 text-[10px]">
          <button id="chart-tab-bar" onclick="switchChartType('bar')" class="px-2 py-0.5 rounded-md bg-white/20 font-semibold text-white">Trend</button>
          <button id="chart-tab-pie" onclick="switchChartType('pie')" class="px-2 py-0.5 rounded-md text-neutral-400">Categories</button>
        </div>
      </div>

      <div class="h-44 w-full relative">
        <canvas id="expenseChart"></canvas>
      </div>
    </div>

    <!-- Transactions List Section -->
    <div class="space-y-3 pt-1">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-sm font-bold text-neutral-200 tracking-tight">Recent Activity</h3>
        <span id="transaction-count" class="text-xs text-neutral-500 font-medium">0 entries</span>
      </div>

      <!-- Quick Search / Filter Input -->
      <div class="relative">
        <input 
          id="search-input" 
          type="text" 
          placeholder="Search by note, category, or payment..." 
          oninput="handleSearch(this.value)"
          class="w-full bg-neutral-900/70 border border-white/5 text-xs text-white rounded-xl pl-9 pr-4 py-2.5 focus:outline-none focus:border-blue-500 transition-colors"
        />
        <svg class="w-4 h-4 text-neutral-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <!-- Transaction Groups Container -->
      <div id="transactions-container" class="space-y-3">
        <!-- Rendered Dynamically via JS -->
      </div>
    </div>
  </main>

  <!-- iOS Bottom Navigation Bar with Prominent Dynamic Glass Center Button -->
  <nav class="glass-nav fixed bottom-0 left-0 right-0 z-40 max-w-lg mx-auto" style="padding-bottom: max(var(--sab), 14px);">
    <div class="flex items-center justify-around px-6 pt-2.5">
      <!-- Home -->
      <a href="index.html" class="tap-scale flex flex-col items-center text-blue-400">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11.5L12 5l8 6.5"></path>
          <path d="M6.5 9.5V19h11v-9.5"></path>
        </svg>
        <span class="text-[10px] font-medium mt-0.5">Home</span>
      </a>

      <!-- Center Action Button (Add Expense) -->
      <div class="-top-5 relative">
        <button onclick="openAddModal()" class="tap-scale w-14 h-14 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-glow-accent border-2 border-[#121420]">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
          </svg>
        </button>
      </div>

      <!-- Settings / Reports -->
      <button onclick="openSettingsModal()" class="tap-scale flex flex-col items-center text-neutral-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
        <span class="text-[10px] font-medium mt-0.5">Manage</span>
      </button>
    </div>
  </nav>

  <!-- iOS Native Style Bottom Sheet Modal for Adding Expense -->
  <div id="add-modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 transition-opacity duration-300 opacity-0 pointer-events-none" onclick="closeAddModal()"></div>
  <div id="add-modal-sheet" class="fixed bottom-0 left-0 right-0 z-50 glass-card bg-[#12141f]/95 border-t border-white/10 rounded-t-[36px] max-w-lg mx-auto sheet-transition sheet-hidden flex flex-col max-h-[92vh] shadow-2xl" style="padding-bottom: max(var(--sab), 24px);">
    
    <!-- Drag indicator grabber -->
    <div class="w-12 h-1.5 bg-neutral-600/70 rounded-full mx-auto mt-3 mb-2"></div>
    
    <div class="px-6 pb-6 pt-1 overflow-y-auto space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white tracking-tight" id="modal-title">New Expense</h3>
        <button onclick="closeAddModal()" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-neutral-300 text-xs font-semibold">✕</button>
      </div>

      <!-- Big Numeric Amount Input -->
      <div class="flex flex-col items-center justify-center py-2">
        <span class="text-xs text-neutral-400 uppercase tracking-wider font-medium mb-1">Enter Amount</span>
        <div class="flex items-center text-white">
          <span class="text-3xl font-light text-neutral-400 mr-1.5" id="modal-currency-sign">₹</span>
          <input 
            id="expense-amount" 
            type="number" 
            inputmode="decimal" 
            placeholder="0" 
            step="0.01" 
            class="text-4xl font-extrabold bg-transparent text-center focus:outline-none w-48 text-white placeholder-neutral-600"
            autofocus
          />
        </div>
      </div>

      <!-- Category Selection Chips -->
      <div>
        <label class="text-[11px] font-semibold text-neutral-400 uppercase tracking-wider block mb-2">Category</label>
        <div class="grid grid-cols-4 gap-2" id="category-selector-container">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Note / Description -->
      <div>
        <label class="text-[11px] font-semibold text-neutral-400 uppercase tracking-wider block mb-1.5">Note (Optional)</label>
        <input 
          id="expense-note" 
          type="text" 
          placeholder="e.g. Dinner with Friends, Uber, Groceries" 
          class="w-full bg-neutral-900/90 border border-white/10 text-sm text-white rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-blue-500"
        />
      </div>

      <!-- Payment Method & Date in Row -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[11px] font-semibold text-neutral-400 uppercase tracking-wider block mb-1.5">Payment</label>
          <select id="expense-payment" class="w-full bg-neutral-900/90 border border-white/10 text-sm text-neutral-200 rounded-xl px-3 py-2.5 focus:outline-none">
            <option value="UPI">UPI / GPay</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Cash">Cash</option>
            <option value="Apple Pay">Apple Pay</option>
          </select>
        </div>
        <div>
          <label class="text-[11px] font-semibold text-neutral-400 uppercase tracking-wider block mb-1.5">Date</label>
          <input 
            id="expense-date" 
            type="date" 
            class="w-full bg-neutral-900/90 border border-white/10 text-sm text-neutral-200 rounded-xl px-3 py-2.5 focus:outline-none"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        onclick="saveExpense()" 
        class="tap-scale w-full py-3.5 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white font-bold text-base shadow-lg shadow-blue-500/25 mt-2 flex items-center justify-center space-x-2">
        <span>Save Transaction</span>
      </button>
    </div>
  </div>

  <!-- Settings / Management Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-card bg-[#141624] border border-white/10 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h3 class="text-base font-bold text-white">Settings & Data</h3>
        <button onclick="closeSettingsModal()" class="w-7 h-7 rounded-full bg-white/10 text-neutral-300 flex items-center justify-center text-xs font-semibold">✕</button>
      </div>

      <!-- Monthly Budget Set -->
      <div class="space-y-1.5">
        <label class="text-xs text-neutral-400">Monthly Budget Limit</label>
        <div class="flex items-center space-x-2">
          <input id="setting-budget-input" type="number" class="w-full bg-neutral-900 border border-white/10 rounded-xl px-3 py-2 text-sm text-white" value="50000" />
          <button onclick="updateMonthlyBudget()" class="tap-scale px-3 py-2 bg-blue-600 rounded-xl text-xs font-semibold text-white">Save</button>
        </div>
      </div>

      <!-- Currency Picker -->
      <div class="space-y-1.5">
        <label class="text-xs text-neutral-400">Primary Currency</label>
        <select id="setting-currency-select" onchange="changeCurrency(this.value)" class="w-full bg-neutral-900 border border-white/10 rounded-xl px-3 py-2 text-sm text-white">
          <option value="INR">₹ INR (Indian Rupee)</option>
          <option value="USD">$ USD (US Dollar)</option>
          <option value="EUR">€ EUR (Euro)</option>
          <option value="GBP">£ GBP (British Pound)</option>
          <option value="AED">د.إ AED (Dirham)</option>
        </select>
      </div>

      <!-- Device Storage Toggle -->
      <div class="flex items-center justify-between rounded-xl bg-neutral-900/80 border border-white/10 px-3 py-2.5">
        <div>
          <p class="text-xs font-semibold text-white">Save on this device</p>
          <p id="storage-location-label" class="text-[10px] text-neutral-400">Browser local storage</p>
        </div>
        <button id="device-storage-toggle" type="button" class="relative inline-flex h-6 w-11 items-center rounded-full bg-neutral-600 transition-colors focus:outline-none">
          <span class="sr-only">Toggle device storage</span>
          <span class="inline-block h-5 w-5 rounded-full bg-white shadow transition-transform" style="transform: translateX(2px)"></span>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button id="choose-storage-button" onclick="chooseDataFolder()" class="tap-scale w-full py-2.5 rounded-xl bg-white/10 border border-white/10 text-xs font-semibold text-white">
          Choose Folder
        </button>
        <button onclick="saveDataToFolderNow()" class="tap-scale w-full py-2.5 rounded-xl bg-blue-500/15 border border-blue-500/30 text-xs font-semibold text-blue-300">
          Save to Folder
        </button>
      </div>

      <button id="install-app-button" onclick="installPwa()" class="tap-scale w-full py-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-xs font-semibold text-emerald-300 hidden">
        Install App on Home Screen
      </button>

      <!-- Export & Reset Buttons -->
      <div class="pt-2 space-y-2">
        <button onclick="exportCSV()" class="tap-scale w-full py-2.5 rounded-xl bg-white/10 border border-white/10 text-xs font-semibold text-white flex items-center justify-center gap-2">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Export CSV (Excel / Numbers)
        </button>

        <button onclick="loadSampleData()" class="tap-scale w-full py-2.5 rounded-xl bg-white/5 border border-white/5 text-xs font-semibold text-neutral-300">
          Load Sample Demo Data
        </button>

        <button id="reset-all-data-button" onclick="confirmClearData()" class="tap-scale w-full py-2.5 rounded-xl bg-red-500/15 border border-red-500/30 text-xs font-semibold text-red-400">
          Reset All Data
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Banner / Toast -->
  <div id="toast-banner" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 glass-card bg-neutral-900/90 border border-white/15 px-4 py-2 rounded-full text-xs font-semibold text-white shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2">
    <span id="toast-icon">✓</span>
    <span id="toast-msg">Updated</span>
  </div>

  <script>
    // --- Application State ---
    const STORAGE_KEY_TRANSACTIONS = 'aura_expenses_v1';
    const STORAGE_KEY_BUDGET = 'aura_budget_v1';
    const STORAGE_KEY_CURRENCY = 'aura_currency_v1';
    const STORAGE_KEY_DEVICE_STORAGE = 'aura_device_storage_v1';
    const STORAGE_KEY_FOLDER_NAME = 'aura_storage_folder_name_v1';
    const STORAGE_KEY_DAILY_NOTES = 'aura_daily_notes_v1';

    const CATEGORIES = [
      { name: 'Food & Dining', icon: '🍕', color: '#FF9F0A' },
      { name: 'Groceries', icon: '🛒', color: '#30D158' },
      { name: 'Shopping', icon: '🛍️', color: '#FF375F' },
      { name: 'Transport', icon: '🚗', color: '#0A84FF' },
      { name: 'Utilities', icon: '💡', color: '#BF5AF2' },
      { name: 'Entertainment', icon: '🎬', color: '#FFD60A' },
      { name: 'Health', icon: '💊', color: '#64D2FF' },
      { name: 'Other', icon: '📦', color: '#8E8E93' }
    ];

    const CURRENCY_SYMBOLS = {
      'INR': '₹',
      'USD': '$',
      'EUR': '€',
      'GBP': '£',
      'AED': 'AED '
    };

    let expenses = [];
    let monthlyBudget = 50000;
    let currentCurrency = 'INR';
    let deviceStorageEnabled = true;
    let selectedDataFolderHandle = null;
    let selectedFolderName = 'Browser local storage';
    let selectedTimeframe = 'week'; // 'today' | 'week' | 'month' | 'year'
    let selectedCategory = CATEGORIES[0].name;
    let customDateFrom = '';
    let customDateTo = '';
    let chartInstance = null;
    let activeChartType = 'bar'; // 'bar' | 'pie'

    // --- Sample Seed Data ---
    const SAMPLE_DATA = generateSampleYearData();

    function generateSampleYearData() {
      const data = [];
      const categories = CATEGORIES.map(c => c.name);
      const paymentMethods = ['UPI', 'Credit Card', 'Debit Card', 'Cash', 'Apple Pay'];
      const notes = {
        'Food & Dining': ['Cafe brunch', 'Dinner with friends', 'Office lunch', 'Weekend pizza', 'Street food', 'Team dinner'],
        'Groceries': ['Supermarket', 'Organic groceries', 'Monthly household stock', 'Fresh produce', 'Bulk purchase'],
        'Shopping': ['Apparel', 'Electronics', 'Home decor', 'Sneakers', 'Stationery'],
        'Transport': ['Metro pass', 'Fuel refill', 'Ride share', 'Car service', 'Taxi ride'],
        'Utilities': ['Internet bill', 'Power bill', 'Water bill', 'Mobile recharge'],
        'Entertainment': ['Movie night', 'Concert', 'Streaming plan', 'Game purchase', 'Bookstore'],
        'Health': ['Pharmacy', 'Supplements', 'Doctor visit', 'Fitness class', 'Gym membership'],
        'Other': ['Misc purchase', 'Travel essentials', 'House repairs', 'Gift purchase']
      };

      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 1);
      const end = new Date(now.getFullYear(), 11, 31);

      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const chance = Math.random();
        if (chance < 0.22) {
          const category = categories[Math.floor(Math.random() * categories.length)];
          const amount = Math.floor((Math.random() * 2800) + 150);
          const notePool = notes[category] || notes['Other'];
          const note = notePool[Math.floor(Math.random() * notePool.length)];
          const payment = paymentMethods[Math.floor(Math.random() * paymentMethods.length)];
          const date = new Date(d);
          data.push({
            id: `sample-${date.toISOString()}-${Math.random().toString(16).slice(2)}`,
            amount,
            category,
            note,
            payment,
            date: date.toISOString().split('T')[0]
          });
        }
      }

      if (data.length === 0) {
        return [
          { id: '1', amount: 450, category: 'Food & Dining', note: 'Artisanal Cafe & Croissant', payment: 'UPI', date: getFormattedDate(0) },
          { id: '2', amount: 1250, category: 'Groceries', note: 'Organic supermarket haul', payment: 'Credit Card', date: getFormattedDate(0) },
          { id: '3', amount: 320, category: 'Transport', note: 'Uber Ride to Tech Park', payment: 'UPI', date: getFormattedDate(1) },
          { id: '4', amount: 2899, category: 'Shopping', note: 'Zara linen shirt', payment: 'Credit Card', date: getFormattedDate(2) },
          { id: '5', amount: 650, category: 'Entertainment', note: 'Movie IMAX Tickets', payment: 'Debit Card', date: getFormattedDate(3) },
          { id: '6', amount: 1500, category: 'Utilities', note: 'Fiber Broadband Renewal', payment: 'UPI', date: getFormattedDate(4) },
          { id: '7', amount: 480, category: 'Health', note: 'Vitamin C & Supplements', payment: 'UPI', date: getFormattedDate(5) }
        ];
      }

      return data;
    }

    function getFormattedDate(daysAgo) {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      return d.toISOString().split('T')[0];
    }

    // --- Init ---
    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      setupDeviceStorageToggle();
      buildCategoryChips();
      setDefaultDate();
      renderUI();
      setupCurrencySelector();
      registerServiceWorker();
      setupInstallPrompt();
      loadDataFromFolder();
    });

    function loadStorage() {
      const storedExpenses = localStorage.getItem(STORAGE_KEY_TRANSACTIONS);
      const storedBudget = localStorage.getItem(STORAGE_KEY_BUDGET);
      const storedCurrency = localStorage.getItem(STORAGE_KEY_CURRENCY);
      const storedDeviceStorage = localStorage.getItem(STORAGE_KEY_DEVICE_STORAGE);
      const storedFolderName = localStorage.getItem(STORAGE_KEY_FOLDER_NAME);

      if (storedDeviceStorage !== null) {
        deviceStorageEnabled = storedDeviceStorage === 'true';
      }

      if (storedFolderName) {
        selectedFolderName = storedFolderName;
      }

      if (storedExpenses) {
        try {
          expenses = JSON.parse(storedExpenses);
        } catch (error) {
          expenses = SAMPLE_DATA;
        }
      } else {
        expenses = SAMPLE_DATA;
        saveToLocalStorage();
      }

      if (storedBudget) {
        monthlyBudget = parseFloat(storedBudget);
      }
      document.getElementById('setting-budget-input').value = monthlyBudget;

      if (storedCurrency && CURRENCY_SYMBOLS[storedCurrency]) {
        currentCurrency = storedCurrency;
      }

      updateCurrencyVisuals();
      updateDeviceStorageToggle();
      updateStorageLocationLabel();
    }

    function saveToLocalStorage() {
      if (!deviceStorageEnabled) {
        localStorage.setItem(STORAGE_KEY_DEVICE_STORAGE, 'false');
        return;
      }

      try {
        localStorage.setItem(STORAGE_KEY_TRANSACTIONS, JSON.stringify(expenses));
        localStorage.setItem(STORAGE_KEY_BUDGET, monthlyBudget.toString());
        localStorage.setItem(STORAGE_KEY_CURRENCY, currentCurrency);
        localStorage.setItem(STORAGE_KEY_DEVICE_STORAGE, 'true');
        localStorage.setItem(STORAGE_KEY_FOLDER_NAME, selectedFolderName);
      } catch (error) {
        showToast('Device storage is full. Please clear older data.', '⚠️');
      }

      saveDataToFolderNow().catch(() => {});
    }

    function updateStorageLocationLabel() {
      const el = document.getElementById('storage-location-label');
      const button = document.getElementById('choose-storage-button');
      const storageLabel = selectedFolderName || 'Browser local storage';
      if (el) el.innerText = storageLabel;
      if (button) {
        button.innerText = ('showDirectoryPicker' in window) ? 'Choose Folder' : 'Use Browser Storage';
      }
    }

    async function chooseDataFolder() {
      if (!('showDirectoryPicker' in window)) {
        selectedDataFolderHandle = null;
        selectedFolderName = 'Browser local storage';
        localStorage.setItem(STORAGE_KEY_FOLDER_NAME, selectedFolderName);
        updateStorageLocationLabel();
        localStorage.setItem(STORAGE_KEY_DEVICE_STORAGE, 'true');
        deviceStorageEnabled = true;
        updateDeviceStorageToggle();
        saveToLocalStorage();
        showToast('Safari does not support folder picking. Using browser storage on this device instead.', '📱');
        return;
      }

      try {
        selectedDataFolderHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        selectedFolderName = selectedDataFolderHandle.name;
        localStorage.setItem(STORAGE_KEY_FOLDER_NAME, selectedFolderName);
        updateStorageLocationLabel();
        await saveDataToFolderNow();
        showToast(`Folder selected: ${selectedFolderName}`, '📁');
      } catch (error) {
        showToast('Folder selection cancelled', 'ℹ️');
      }
    }

    async function saveDataToFolderNow() {
      if (!selectedDataFolderHandle) return;

      try {
        const fileHandle = await selectedDataFolderHandle.getFileHandle('aura-wallet-data.json', { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify({
          expenses,
          monthlyBudget,
          currentCurrency,
          savedAt: new Date().toISOString()
        }, null, 2));
        await writable.close();
      } catch (error) {
        showToast('Could not save to selected folder', '⚠️');
      }
    }

    async function loadDataFromFolder() {
      if (!selectedDataFolderHandle) return;

      try {
        const fileHandle = await selectedDataFolderHandle.getFileHandle('aura-wallet-data.json');
        const file = await fileHandle.getFile();
        const data = JSON.parse(await file.text());
        if (Array.isArray(data.expenses)) {
          expenses = data.expenses;
        }
        if (data.monthlyBudget) {
          monthlyBudget = Number(data.monthlyBudget);
        }
        if (data.currentCurrency && CURRENCY_SYMBOLS[data.currentCurrency]) {
          currentCurrency = data.currentCurrency;
        }
        document.getElementById('setting-budget-input').value = monthlyBudget;
        updateCurrencyVisuals();
        renderUI();
      } catch (error) {
        // No saved file yet; ignore and keep current in-memory data.
      }
    }

    function setupDeviceStorageToggle() {
      const toggleBtn = document.getElementById('device-storage-toggle');
      if (!toggleBtn) return;

      toggleBtn.addEventListener('click', () => {
        deviceStorageEnabled = !deviceStorageEnabled;
        localStorage.setItem(STORAGE_KEY_DEVICE_STORAGE, String(deviceStorageEnabled));
        updateDeviceStorageToggle();

        if (deviceStorageEnabled) {
          saveToLocalStorage();
          showToast('Saved on this device', '📱');
        } else {
          showToast('Storage paused on this device', '🔒');
        }
      });
    }

    function updateDeviceStorageToggle() {
      const toggleBtn = document.getElementById('device-storage-toggle');
      if (!toggleBtn) return;

      toggleBtn.classList.toggle('bg-emerald-500', deviceStorageEnabled);
      toggleBtn.classList.toggle('bg-neutral-600', !deviceStorageEnabled);
      toggleBtn.querySelector('span').style.transform = deviceStorageEnabled ? 'translateX(22px)' : 'translateX(2px)';
      toggleBtn.querySelector('span').classList.toggle('bg-emerald-300', deviceStorageEnabled);
      toggleBtn.querySelector('span').classList.toggle('bg-white', !deviceStorageEnabled);
    }

    function setDefaultDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('expense-date').value = today;
    }

    // --- UI Rendering ---
    function renderUI() {
      const filtered = getFilteredExpenses();
      updateBalanceSummary(filtered);
      renderTransactionsList(filtered);
      renderChart(filtered);
    }

    function getFilteredExpenses(searchQuery = '') {
      const now = new Date();
      const todayStr = now.toISOString().split('T')[0];

      return expenses.filter(item => {
        const itemDate = item.date;

        if (customDateFrom || customDateTo) {
          if (customDateFrom && itemDate < customDateFrom) return false;
          if (customDateTo && itemDate > customDateTo) return false;
        } else {
          let matchesTimeframe = true;

          if (selectedTimeframe === 'today') {
            matchesTimeframe = itemDate === todayStr;
          } else if (selectedTimeframe === 'week') {
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(now.getDate() - 6);
            matchesTimeframe = new Date(itemDate) >= sevenDaysAgo && new Date(itemDate) <= now;
          } else if (selectedTimeframe === 'month') {
            const itemDateObj = new Date(itemDate);
            matchesTimeframe = itemDateObj.getMonth() === now.getMonth() && itemDateObj.getFullYear() === now.getFullYear();
          } else if (selectedTimeframe === 'year') {
            matchesTimeframe = new Date(itemDate).getFullYear() === now.getFullYear();
          }

          if (!matchesTimeframe) return false;
        }

        let matchesSearch = true;
        if (searchQuery.trim().length > 0) {
          const q = searchQuery.toLowerCase();
          matchesSearch = (item.note && item.note.toLowerCase().includes(q)) ||
                          item.category.toLowerCase().includes(q) ||
                          item.payment.toLowerCase().includes(q);
        }

        return matchesSearch;
      });
    }

    function updateBalanceSummary(list) {
      const symbol = CURRENCY_SYMBOLS[currentCurrency];
      const total = list.reduce((sum, item) => sum + parseFloat(item.amount), 0);

      let daysCount = 1;
      if (selectedTimeframe === 'week') daysCount = 7;
      if (selectedTimeframe === 'month') daysCount = new Date().getDate();
      if (selectedTimeframe === 'year') daysCount = 365;
      const dailyAvg = total / daysCount;

      let budgetBase = monthlyBudget;
      if (selectedTimeframe === 'year') {
        budgetBase = monthlyBudget * 12;
      }

      const remaining = Math.max(0, budgetBase - total);
      const spentPercent = Math.min(100, Math.round((total / budgetBase) * 100));

      document.getElementById('hero-total-spent').innerText = total.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('hero-daily-avg').innerText = `${symbol}${Math.round(dailyAvg).toLocaleString('en-IN')}`;
      document.getElementById('hero-remaining-budget').innerText = `${symbol}${remaining.toLocaleString('en-IN')}`;
      document.getElementById('budget-percentage').innerText = `${spentPercent}%`;

      const bar = document.getElementById('budget-progress-bar');
      bar.style.width = `${spentPercent}%`;

      const badge = document.getElementById('hero-badge');
      if (spentPercent > 90) {
        badge.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-red-500/20 text-red-400 border border-red-500/30";
        badge.innerText = "Over Limit Warning";
      } else if (spentPercent > 70) {
        badge.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-amber-500/20 text-amber-400 border border-amber-500/30";
        badge.innerText = "Approaching Limit";
      } else {
        badge.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";
        badge.innerText = "Budget on Track";
      }
    }

    function renderTransactionsList(list) {
      const container = document.getElementById('transactions-container');
      const countLabel = document.getElementById('transaction-count');
      const symbol = CURRENCY_SYMBOLS[currentCurrency];

      countLabel.innerText = `${list.length} item${list.length === 1 ? '' : 's'}`;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="glass-card-subtle rounded-2xl p-8 text-center border border-white/5">
            <span class="text-3xl block mb-2">💸</span>
            <p class="text-sm font-semibold text-neutral-300">No expenses recorded</p>
            <p class="text-xs text-neutral-500 mt-1">Tap the plus button below to log your first spend.</p>
          </div>
        `;
        return;
      }

      // Group by date
      const grouped = {};
      list.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(item => {
        if (!grouped[item.date]) grouped[item.date] = [];
        grouped[item.date].push(item);
      });

      const todayStr = new Date().toISOString().split('T')[0];
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().split('T')[0];

      let html = '';
      for (const [dateStr, items] of Object.entries(grouped)) {
        let displayHeading = dateStr;
        if (dateStr === todayStr) displayHeading = 'Today';
        else if (dateStr === yesterdayStr) displayHeading = 'Yesterday';
        else {
          const d = new Date(dateStr);
          displayHeading = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        const dateSubtotal = items.reduce((sum, i) => sum + parseFloat(i.amount), 0);

        html += `
          <div class="space-y-1.5">
            <div class="flex justify-between items-center px-2 pt-1 text-[11px] text-neutral-400 font-semibold tracking-wider uppercase">
              <span>${displayHeading}</span>
              <span>${symbol}${dateSubtotal.toLocaleString('en-IN')}</span>
            </div>
            <div class="glass-card-subtle rounded-2xl overflow-hidden border border-white/5 divide-y divide-white/5">
        `;

        items.forEach(exp => {
          const cat = CATEGORIES.find(c => c.name === exp.category) || { icon: '📦', color: '#8E8E93' };
          html += `
            <div class="flex items-center justify-between p-3.5 hover:bg-white/[0.03] transition-colors">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-lg bg-neutral-800/80 border border-white/10 shadow-inner">
                  ${cat.icon}
                </div>
                <div>
                  <p class="text-xs font-bold text-white line-clamp-1">${exp.note ? exp.note : exp.category}</p>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="text-[10px] text-neutral-400 font-medium">${exp.category}</span>
                    <span class="text-[10px] text-neutral-600">•</span>
                    <span class="text-[9px] px-1.5 py-0.2 rounded bg-neutral-800 text-neutral-400 border border-white/5">${exp.payment}</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center space-x-3">
                <span class="text-sm font-bold text-white tracking-tight">-${symbol}${parseFloat(exp.amount).toLocaleString('en-IN')}</span>
                <button onclick="deleteExpense('${exp.id}')" class="text-neutral-600 hover:text-red-400 tap-scale p-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // --- Chart Rendering ---
    function renderChart(list) {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (chartInstance) {
        chartInstance.destroy();
      }

      const fiveColorGradients = ['#60a5fa', '#34d399', '#a78bfa', '#fbbf24', '#fb7185'];

      if (activeChartType === 'bar') {
        const chartBuckets = [];
        const now = new Date();

        if (selectedTimeframe === 'week') {
          for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const key = d.toISOString().split('T')[0];
            chartBuckets.push({
              key,
              label: d.toLocaleDateString('en-US', { weekday: 'short' }),
              items: []
            });
          }

          list.forEach(item => {
            const bucket = chartBuckets.find(b => b.key === item.date);
            if (bucket) bucket.items.push(item);
          });
        } else if (selectedTimeframe === 'month') {
          const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
          const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);

          const weekStarts = [];
          let current = new Date(monthStart);
          current.setDate(current.getDate() - current.getDay());

          while (current <= monthEnd) {
            const weekStart = new Date(current);
            const weekEnd = new Date(current);
            weekEnd.setDate(weekStart.getDate() + 6);

            const normalizedWeekStart = new Date(weekStart);
            const normalizedWeekEnd = new Date(weekEnd);
            if (normalizedWeekStart < monthStart) normalizedWeekStart.setTime(monthStart.getTime());
            if (normalizedWeekEnd > monthEnd) normalizedWeekEnd.setTime(monthEnd.getTime());

            weekStarts.push({
              key: `${normalizedWeekStart.toISOString().split('T')[0]}-${normalizedWeekEnd.toISOString().split('T')[0]}`,
              label: `${normalizedWeekStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${normalizedWeekEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`,
              start: new Date(normalizedWeekStart),
              end: new Date(normalizedWeekEnd),
              items: []
            });

            current.setDate(current.getDate() + 7);
          }

          chartBuckets.push(...weekStarts);

          list.forEach(item => {
            const itemDate = new Date(item.date);
            const bucket = chartBuckets.find(b => itemDate >= b.start && itemDate <= b.end);
            if (bucket) bucket.items.push(item);
          });
        } else if (selectedTimeframe === 'year') {
          for (let i = 0; i < 12; i++) {
            const monthDate = new Date(now.getFullYear(), i, 1);
            const monthKey = `${monthDate.getFullYear()}-${String(i + 1).padStart(2, '0')}`;
            chartBuckets.push({
              key: monthKey,
              label: monthDate.toLocaleDateString('en-US', { month: 'short' }),
              start: new Date(now.getFullYear(), i, 1),
              end: new Date(now.getFullYear(), i + 1, 0),
              items: []
            });
          }

          list.forEach(item => {
            const itemDate = new Date(item.date);
            const bucket = chartBuckets.find(b => itemDate >= b.start && itemDate <= b.end);
            if (bucket) bucket.items.push(item);
          });
        }

        const dataPoints = chartBuckets.map(bucket => bucket.items.reduce((sum, item) => sum + parseFloat(item.amount), 0));

        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: chartBuckets.map(bucket => bucket.label),
            datasets: [{
              data: dataPoints,
              backgroundColor: (context) => {
                const index = context.dataIndex;
                return fiveColorGradients[index % fiveColorGradients.length];
              },
              borderColor: 'rgba(255,255,255,0.12)',
              borderWidth: 1,
              borderRadius: { topLeft: 10, topRight: 10, bottomLeft: 0, bottomRight: 0 },
              hoverBackgroundColor: '#8ab4ff',
              borderSkipped: false,
              barThickness: 'flex'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 800, easing: 'easeOutCubic' },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(20, 22, 34, 0.98)',
                titleFont: { size: 11 },
                bodyFont: { size: 12, weight: 'bold' },
                cornerRadius: 10,
                displayColors: false,
                padding: 12,
                callbacks: {
                  title: (items) => `${items[0].label}`,
                  label: (ctx) => `${CURRENCY_SYMBOLS[currentCurrency]}${ctx.parsed.y.toLocaleString()} total`,
                  afterLabel: (ctx) => {
                    const bucket = chartBuckets[ctx.dataIndex];
                    if (!bucket || bucket.items.length === 0) return '';
                    const topItems = bucket.items.slice(0, 3).map(item => `${item.category}: ${CURRENCY_SYMBOLS[currentCurrency]}${parseFloat(item.amount).toLocaleString('en-IN')}`);
                    return topItems.join('\n');
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: '#a1a1aa', font: { size: 10 } }
              },
              y: {
                grid: { color: 'rgba(255,255,255,0.08)' },
                ticks: {
                  color: '#a1a1aa',
                  font: { size: 9 },
                  callback: val => val >= 1000 ? `${val/1000}k` : val
                }
              }
            }
          }
        });
      } else {
        const catMap = {};
        list.forEach(item => {
          catMap[item.category] = (catMap[item.category] || 0) + parseFloat(item.amount);
        });

        const catNames = Object.keys(catMap);
        const catValues = Object.values(catMap);
        const catColors = catNames.map((name, index) => {
          const match = CATEGORIES.find(c => c.name === name);
          return match ? match.color : fiveColorGradients[index % fiveColorGradients.length];
        });

        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: catNames,
            datasets: [{
              data: catValues,
              backgroundColor: catColors,
              borderWidth: 2,
              borderColor: '#0b0f18',
              hoverOffset: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '72%',
            plugins: {
              legend: {
                position: 'right',
                labels: { color: '#d4d4d8', font: { size: 10 }, boxWidth: 10, padding: 8 }
              },
              tooltip: {
                backgroundColor: 'rgba(20, 22, 34, 0.98)',
                cornerRadius: 10,
                callbacks: {
                  label: (c) => ` ${c.label}: ${CURRENCY_SYMBOLS[currentCurrency]}${c.parsed.toLocaleString()}`
                }
              }
            }
          }
        });
      }
    }

    function switchChartType(type) {
      activeChartType = type;
      const barBtn = document.getElementById('chart-tab-bar');
      const pieBtn = document.getElementById('chart-tab-pie');

      if (type === 'bar') {
        barBtn.className = "px-2 py-0.5 rounded-md bg-white/20 font-semibold text-white";
        pieBtn.className = "px-2 py-0.5 rounded-md text-neutral-400";
      } else {
        pieBtn.className = "px-2 py-0.5 rounded-md bg-white/20 font-semibold text-white";
        barBtn.className = "px-2 py-0.5 rounded-md text-neutral-400";
      }
      renderChart(getFilteredExpenses());
    }

    // --- Category Selection Chips ---
    function buildCategoryChips() {
      const cont = document.getElementById('category-selector-container');
      cont.innerHTML = '';
      CATEGORIES.forEach((cat, index) => {
        const isSelected = cat.name === selectedCategory;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => selectCategory(cat.name);
        btn.className = `tap-scale p-2 rounded-xl border flex flex-col items-center justify-center transition-all ${
          isSelected 
            ? 'bg-blue-600/30 border-blue-500 text-white shadow-md' 
            : 'bg-neutral-900/60 border-white/5 text-neutral-400 hover:text-white'
        }`;
        btn.innerHTML = `
          <span class="text-base mb-0.5">${cat.icon}</span>
          <span class="text-[9px] font-medium truncate w-full text-center">${cat.name.split(' ')[0]}</span>
        `;
        cont.appendChild(btn);
      });
    }

    function selectCategory(name) {
      selectedCategory = name;
      buildCategoryChips();
    }

    // --- Modal Controls ---
    function openAddModal() {
      const overlay = document.getElementById('add-modal-overlay');
      const sheet = document.getElementById('add-modal-sheet');
      
      overlay.classList.remove('pointer-events-none', 'opacity-0');
      overlay.classList.add('opacity-100');
      sheet.classList.remove('sheet-hidden');

      document.getElementById('expense-amount').focus();
    }

    function openAddModalWithCategory(catName) {
      selectCategory(catName);
      openAddModal();
    }

    function closeAddModal() {
      const overlay = document.getElementById('add-modal-overlay');
      const sheet = document.getElementById('add-modal-sheet');

      overlay.classList.add('opacity-0', 'pointer-events-none');
      overlay.classList.remove('opacity-100');
      sheet.classList.add('sheet-hidden');

      // Clear fields
      document.getElementById('expense-amount').value = '';
      document.getElementById('expense-note').value = '';
    }

    // --- Expense Actions ---
    function saveExpense() {
      const amountInput = document.getElementById('expense-amount');
      const amountVal = parseFloat(amountInput.value);
      const noteVal = document.getElementById('expense-note').value.trim();
      const paymentVal = document.getElementById('expense-payment').value;
      const dateVal = document.getElementById('expense-date').value;

      if (!amountVal || isNaN(amountVal) || amountVal <= 0) {
        showToast('Please enter a valid amount', '⚠️');
        amountInput.focus();
        return;
      }

      const newExpense = {
        id: Date.now().toString(),
        amount: amountVal,
        category: selectedCategory,
        note: noteVal,
        payment: paymentVal,
        date: dateVal || new Date().toISOString().split('T')[0]
      };

      expenses.unshift(newExpense);
      saveToLocalStorage();
      closeAddModal();
      renderUI();
      showToast('Expense logged smoothly', '✓');
    }

    function deleteExpense(id) {
      expenses = expenses.filter(e => e.id !== id);
      saveToLocalStorage();
      renderUI();
      showToast('Expense removed', '🗑️');
    }

    // --- Timeframe Filter Handling ---
    function setTimeframe(tf) {
      selectedTimeframe = tf;
      ['today', 'week', 'month', 'year'].forEach(tab => {
        const el = document.getElementById(`tab-${tab}`);
        if (tab === tf) {
          el.className = "flex-1 py-1.5 text-[10px] font-semibold rounded-xl transition-all duration-200 bg-gradient-to-r from-blue-500/25 to-purple-500/25 text-white shadow-lg shadow-blue-500/20 border border-white/10";
        } else {
          el.className = "flex-1 py-1.5 text-[10px] font-semibold rounded-xl transition-all duration-200 text-neutral-400";
        }
      });
      renderUI();
      renderRecentNotes();
    }

    function applyDateFilter() {
      const fromInput = document.getElementById('filter-from-date');
      const toInput = document.getElementById('filter-to-date');

      customDateFrom = fromInput.value || '';
      customDateTo = toInput.value || '';

      if (customDateFrom && customDateTo && customDateFrom > customDateTo) {
        const temp = customDateFrom;
        customDateFrom = customDateTo;
        customDateTo = temp;
        fromInput.value = customDateFrom;
        toInput.value = customDateTo;
      }

      renderUI();
      renderRecentNotes();
    }

    function clearDateFilter() {
      customDateFrom = '';
      customDateTo = '';
      const fromInput = document.getElementById('filter-from-date');
      const toInput = document.getElementById('filter-to-date');
      if (fromInput) fromInput.value = '';
      if (toInput) toInput.value = '';
      renderUI();
      renderRecentNotes();
    }

    function handleSearch(val) {
      const filtered = getFilteredExpenses(val);
      renderTransactionsList(filtered);
    }

    // --- Currency Controls ---
    function setupCurrencySelector() {
      const toggle = document.getElementById('currency-toggle');
      toggle.addEventListener('click', () => {
        const keys = Object.keys(CURRENCY_SYMBOLS);
        const nextIdx = (keys.indexOf(currentCurrency) + 1) % keys.length;
        changeCurrency(keys[nextIdx]);
      });
    }

    function changeCurrency(newCurr) {
      currentCurrency = newCurr;
      updateCurrencyVisuals();
      saveToLocalStorage();
      renderUI();
      showToast(`Switched currency to ${newCurr}`, '💱');
    }

    function updateCurrencyVisuals() {
      const sym = CURRENCY_SYMBOLS[currentCurrency];
      document.getElementById('current-currency-symbol').innerText = sym;
      document.getElementById('current-currency-code').innerText = currentCurrency;
      document.getElementById('hero-currency-symbol').innerText = sym;
      document.getElementById('modal-currency-sign').innerText = sym;
      document.getElementById('setting-currency-select').value = currentCurrency;
    }

    // --- Settings & Data ---
    function openSettingsModal() {
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function updateMonthlyBudget() {
      const val = parseFloat(document.getElementById('setting-budget-input').value);
      if (val && !isNaN(val) && val > 0) {
        monthlyBudget = val;
        saveToLocalStorage();
        renderUI();
        closeSettingsModal();
        showToast('Budget goal updated', '🎯');
      }
    }

    function loadSampleData() {
      expenses = [...SAMPLE_DATA];
      saveToLocalStorage();
      renderUI();
      closeSettingsModal();
      showToast('Sample expenses restored', '✨');
    }

    function confirmClearData() {
      const resetButton = document.getElementById('reset-all-data-button');
      if (resetButton.dataset.confirming === 'true') {
        expenses = [];
        saveToLocalStorage();
        renderUI();
        closeSettingsModal();
        resetButton.dataset.confirming = 'false';
        resetButton.innerText = 'Reset All Data';
        resetButton.classList.remove('bg-red-600', 'text-white');
        resetButton.classList.add('bg-red-500/15', 'text-red-400');
        showToast('All transaction records cleared', '🧹');
        return;
      }

      resetButton.dataset.confirming = 'true';
      resetButton.innerText = 'Confirm Reset All Data';
      resetButton.classList.remove('bg-red-500/15', 'text-red-400');
      resetButton.classList.add('bg-red-600', 'text-white');
      showToast('Tap again to confirm permanent reset', '⚠️');
    }

    function exportCSV() {
      if (expenses.length === 0) {
        showToast('No records to export', '⚠️');
        return;
      }
      let csvContent = "data:text/csv;charset=utf-8,ID,Date,Category,Amount,PaymentMethod,Note\n";
      expenses.forEach(e => {
        const noteEscaped = `"${(e.note || '').replace(/"/g, '""')}"`;
        csvContent += `${e.id},${e.date},${e.category},${e.amount},${e.payment},${noteEscaped}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `aura_expenses_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('CSV Exported', '📥');
    }

    function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }

    let deferredInstallPrompt = null;

    function setupInstallPrompt() {
      const installButton = document.getElementById('install-app-button');
      if (!installButton) return;

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        installButton.classList.remove('hidden');
      });

      if (window.matchMedia('(display-mode: standalone)').matches) {
        installButton.classList.add('hidden');
      }
    }

    async function installPwa() {
      const installButton = document.getElementById('install-app-button');
      if (!deferredInstallPrompt) {
        showToast('Open in a supported browser to install this app', '📲');
        return;
      }

      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.classList.add('hidden');
    }

    // --- Toast / Feedback ---
    function showToast(msg, icon = '✓') {
      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-msg').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.add('opacity-0');
        toast.classList.remove('opacity-100');
      }, 2200);
    }
  </script>
</body>
</html>
