<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MJ Suite</title>
  <meta name="theme-color" content="#090a0f">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { iosBgDark: '#07080c', iosCardDark: 'rgba(23, 25, 35, 0.72)', iosCardBorder: 'rgba(255, 255, 255, 0.08)', iosAccent: '#0A84FF', iosGreen: '#30D158', iosOrange: '#FF9F0A', iosPurple: '#BF5AF2', iosRed: '#FF453A', iosPink: '#FF375F' }, fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'] }, boxShadow: { 'glow-accent': '0 8px 30px rgba(10, 132, 255, 0.35)', 'glow-card': '0 10px 40px -10px rgba(0,0,0,0.6)' } } } };
  </script>
  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.20), transparent 24%),
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.22), transparent 30%),
        linear-gradient(180deg, #07080c 0%, #0a0d14 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .tap-scale {
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .tap-scale:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center bg-iosBgDark text-white">
  <div class="w-full max-w-md px-5 py-8">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-[30px] bg-gradient-to-tr from-blue-600 via-indigo-500 to-violet-500 text-xl font-black tracking-[0.2em] shadow-[0_20px_55px_rgba(96,165,250,0.35)] ring-1 ring-white/10">MJ</div>
      <p class="text-[10px] uppercase tracking-[0.32em] text-neutral-400">Welcome back</p>
      <h2 class="mt-3 text-4xl font-black tracking-[-0.06em] text-white">MJ Suite</h2>
      <p class="mt-2 text-sm text-neutral-400">Track money. Capture life.</p>
    </div>

    <div class="mb-6 grid grid-cols-2 gap-2 rounded-[28px] border border-white/10 bg-white/5 p-2 backdrop-blur-xl shadow-[0_12px_40px_rgba(0,0,0,0.25)]">
      <div class="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 px-3 py-2 text-center shadow-inner shadow-emerald-500/10">
        <div class="text-xl">💸</div>
        <div class="mt-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-emerald-300">Budget</div>
      </div>
      <div class="rounded-2xl border border-purple-500/20 bg-purple-500/10 px-3 py-2 text-center shadow-inner shadow-purple-500/10">
        <div class="text-xl">📔</div>
        <div class="mt-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-purple-300">Journal</div>
      </div>
    </div>

    <div class="space-y-4">
      <a href="expense-tracker.html" class="tap-scale group block w-full rounded-[30px] border border-blue-500/20 bg-gradient-to-r from-blue-600/25 via-indigo-600/20 to-violet-600/20 p-4 text-left shadow-[0_18px_50px_rgba(37,99,235,0.12)] transition-all duration-200 hover:-translate-y-0.5 hover:border-blue-400/40 hover:shadow-[0_22px_60px_rgba(37,99,235,0.18)]">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-500/35 to-indigo-500/30 text-2xl shadow-inner shadow-white/10 ring-1 ring-white/10">💸</div>
            <div>
              <p class="text-[10px] uppercase tracking-[0.2em] text-blue-300">Tracker</p>
              <h3 class="mt-1 text-xl font-bold text-white">Expense Tracker</h3>
            </div>
          </div>
          <span class="text-2xl text-blue-200 transition-transform group-hover:translate-x-1">→</span>
        </div>
      </a>

      <a href="journal.html" class="tap-scale group block w-full rounded-[30px] border border-purple-500/20 bg-gradient-to-r from-purple-600/20 via-pink-600/15 to-blue-600/20 p-4 text-left shadow-[0_18px_50px_rgba(168,85,247,0.12)] transition-all duration-200 hover:-translate-y-0.5 hover:border-purple-400/40 hover:shadow-[0_22px_60px_rgba(168,85,247,0.18)]">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-purple-500/30 to-pink-500/25 text-2xl shadow-inner shadow-white/10 ring-1 ring-white/10">📔</div>
            <div>
              <p class="text-[10px] uppercase tracking-[0.2em] text-purple-300">Journal</p>
              <h3 class="mt-1 text-xl font-bold text-white">Daily Notes</h3>
            </div>
          </div>
          <span class="text-2xl text-purple-200 transition-transform group-hover:translate-x-1">→</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
