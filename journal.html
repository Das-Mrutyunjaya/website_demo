<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MJ Journal</title>
  <meta name="theme-color" content="#090a0f" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iosBgDark: '#07080c',
            iosCardDark: 'rgba(23, 25, 35, 0.72)',
            iosCardBorder: 'rgba(255, 255, 255, 0.08)',
            iosAccent: '#0A84FF',
            iosGreen: '#30D158',
            iosOrange: '#FF9F0A',
            iosPurple: '#BF5AF2',
            iosRed: '#FF453A',
            iosPink: '#FF375F',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 47px);
      --sab: env(safe-area-inset-bottom, 34px);
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.18), transparent 22%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.18), transparent 25%),
        linear-gradient(180deg, #07080c 0%, #0a0d14 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
      pointer-events: none;
    }

    .glass-header {
      background: rgba(7, 8, 12, 0.78);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(28, 31, 46, 0.82) 0%, rgba(18, 20, 30, 0.72) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 18px 45px rgba(10, 14, 23, 0.45);
    }

    .glass-subtle {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
    }

    .glass-nav {
      background: rgba(14, 16, 24, 0.82);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .journal-chip {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .mood-button {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .mood-button.active {
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 20px rgba(0,0,0,0.2);
    }

    .journal-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(13,15,22,0.8);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .journal-card::before {
      content: "";
      position: absolute;
      inset: 0 0 0 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0));
      pointer-events: none;
    }

    .journal-card:hover {
      transform: translateX(3px);
    }

    .journal-card .mood-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: 999px;
      background: var(--mood-color, #8b5cf6);
    }

    .tap-scale {
      transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.12s;
    }

    .tap-scale:active {
      transform: scale(0.97);
      opacity: 0.85;
    }

    .dynamic-island-pill {
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-iosBgDark text-white">
  <div class="fixed top-0 left-0 right-0 z-50 pointer-events-none flex flex-col items-center pt-2 select-none" style="padding-top: max(env(safe-area-inset-top), 8px);">
    <div class="hidden w-32 h-7 items-center justify-between rounded-full border border-neutral-800/80 bg-black px-3 dynamic-island-pill sm:flex">
      <div class="h-2 w-2 rounded-full border border-neutral-700 bg-neutral-900"></div>
      <div class="h-2.5 w-2.5 animate-pulse rounded-full bg-emerald-500/80"></div>
    </div>
  </div>

  <div class="mx-auto max-w-md px-4 pb-28 pt-6" style="padding-top: max(var(--sat), 26px);">
    <header class="glass-header mb-4 rounded-b-[30px] px-4 py-3 shadow-[0_16px_40px_rgba(168,85,247,0.08)]">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="index.html" class="tap-scale flex h-10 w-10 items-center justify-center rounded-2xl border border-white/10 bg-white/5 text-xl text-white shadow-inner shadow-white/5">
            ←
          </a>
          <div class="flex items-center gap-2.5">
            <div class="relative flex h-10 w-10 items-center justify-center rounded-[16px] bg-gradient-to-tr from-purple-600 to-blue-500 text-sm font-black text-white shadow-[0_12px_30px_rgba(168,85,247,0.32)] ring-1 ring-white/10">
              <div class="absolute -bottom-1 -right-1 h-3 w-3 rounded-full border-2 border-[#0d1118] bg-emerald-400 shadow-[0_0_16px_rgba(52,211,153,0.7)]"></div>
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12.5L12 5l8 7.5"></path>
                <path d="M6.5 10.5V19h11v-9.5"></path>
              </svg>
            </div>
            <div>
              <p class="text-[10px] uppercase tracking-[0.22em] text-purple-300">Journal</p>
              <h1 class="text-2xl font-bold tracking-tight">MJ Notes</h1>
            </div>
          </div>
        </div>
        <div class="rounded-full border border-purple-500/20 bg-purple-500/10 px-2.5 py-1 text-[10px] font-semibold text-purple-200 shadow-inner shadow-purple-500/10">
          MJ
        </div>
      </div>
    </header>

    <section class="glass-subtle mb-4 rounded-[28px] p-3">
      <div class="mb-2 flex items-center justify-between">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-neutral-300">Date filter</span>
        <button onclick="clearDateFilter()" class="text-[10px] text-neutral-400">Clear</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <label class="block text-[10px] text-neutral-400">
          <span class="mb-1 block">From</span>
          <input id="journal-from" type="date" onchange="applyDateFilter()" class="w-full rounded-xl border border-white/10 bg-neutral-900 px-2 py-1.5 text-[11px] text-white focus:border-purple-500 focus:outline-none" />
        </label>
        <label class="block text-[10px] text-neutral-400">
          <span class="mb-1 block">To</span>
          <input id="journal-to" type="date" onchange="applyDateFilter()" class="w-full rounded-xl border border-white/10 bg-neutral-900 px-2 py-1.5 text-[11px] text-white focus:border-purple-500 focus:outline-none" />
        </label>
      </div>
    </section>

    <section class="glass-card relative mb-4 overflow-hidden rounded-[30px] p-5">
      <div class="absolute -right-8 -top-8 h-32 w-32 rounded-full bg-purple-500/20 blur-3xl"></div>
      <div class="absolute -left-8 -bottom-8 h-32 w-32 rounded-full bg-blue-500/20 blur-3xl"></div>
      <div class="relative z-10">
        <div class="mb-2 flex items-center justify-between">
          <span class="text-[11px] uppercase tracking-[0.2em] text-neutral-400">Summary</span>
          <span id="journal-badge" class="rounded-full border border-emerald-500/30 bg-emerald-500/15 px-2 py-0.5 text-[10px] font-semibold text-emerald-300">Ready</span>
        </div>
        <div class="flex items-center gap-3">
          <div class="rounded-[22px] bg-gradient-to-br from-purple-500/20 to-blue-500/20 p-3 text-3xl shadow-lg shadow-purple-500/10">📔</div>
          <div>
            <div class="flex items-baseline gap-2">
              <span class="text-3xl font-extrabold text-white" id="journal-count">0</span>
              <span class="text-sm text-neutral-400">entries</span>
            </div>
            <p class="mt-1 text-[11px] uppercase tracking-[0.14em] text-neutral-500">Daily memory log</p>
          </div>
        </div>
        <p id="journal-latest-text" class="mt-4 text-sm leading-6 text-neutral-300">Your latest thoughts will appear here.</p>
      </div>
    </section>

    <section class="glass-card mb-4 rounded-[28px] p-4">
      <div class="mb-3 flex items-center justify-between">
        <div>
          <p class="text-[10px] uppercase tracking-[0.2em] text-neutral-400">Daily note</p>
          <h2 class="text-lg font-bold text-white">Write your journal</h2>
        </div>
        <button id="new-note-button" onclick="resetJournalForm()" class="tap-scale rounded-full border border-white/10 bg-white/5 px-2.5 py-1.5 text-[10px] font-semibold text-neutral-300">New</button>
      </div>

      <div class="mb-3 grid grid-cols-3 gap-2">
        <button type="button" onclick="quickJournalPrompt('What went well today?')" class="journal-chip tap-scale rounded-xl px-2 py-2 text-[10px] font-medium text-neutral-200">Wins</button>
        <button type="button" onclick="quickJournalPrompt('What am I grateful for today?')" class="journal-chip tap-scale rounded-xl px-2 py-2 text-[10px] font-medium text-neutral-200">Grateful</button>
        <button type="button" onclick="quickJournalPrompt('What do I want to improve tomorrow?')" class="journal-chip tap-scale rounded-xl px-2 py-2 text-[10px] font-medium text-neutral-200">Plan</button>
      </div>

      <label class="mb-3 block text-[10px] text-neutral-400">
        <span class="mb-1.5 block">Date</span>
        <input id="journal-date" type="date" class="w-full rounded-2xl border border-white/10 bg-neutral-900 px-3 py-2.5 text-sm text-white focus:border-purple-500 focus:outline-none" />
      </label>

      <div class="mb-3 grid grid-cols-3 gap-2" id="mood-picker">
        <button type="button" data-mood="happy" class="mood-button tap-scale rounded-2xl border px-2 py-2 text-[10px] font-semibold text-emerald-200 border-emerald-500/20 bg-emerald-500/10">😊 Happy</button>
        <button type="button" data-mood="calm" class="mood-button tap-scale rounded-2xl border px-2 py-2 text-[10px] font-semibold text-sky-200 border-sky-500/25 bg-sky-500/10">😌 Calm</button>
        <button type="button" data-mood="focused" class="mood-button tap-scale rounded-2xl border px-2 py-2 text-[10px] font-semibold text-violet-200 border-violet-500/25 bg-violet-500/10">🎯 Focused</button>
        <button type="button" data-mood="grateful" class="mood-button tap-scale rounded-2xl border px-2 py-2 text-[10px] font-semibold text-amber-200 border-amber-500/25 bg-amber-500/10">🙏 Grateful</button>
        <button type="button" data-mood="tired" class="mood-button tap-scale rounded-2xl border px-2 py-2 text-[10px] font-semibold text-rose-200 border-rose-500/25 bg-rose-500/10">😴 Tired</button>
        <button type="button" data-mood="overwhelmed" class="mood-button tap-scale rounded-2xl border px-2 py-2 text-[10px] font-semibold text-pink-200 border-pink-500/25 bg-pink-500/10">💭 Overwhelm</button>
      </div>

      <label class="mb-3 block text-[10px] text-neutral-400">
        <span class="mb-1.5 block">Entry</span>
        <textarea id="journal-entry" rows="8" placeholder="Today I felt...\nWhat happened today?\nWhat am I grateful for?" class="w-full resize-none rounded-2xl border border-white/10 bg-neutral-900 px-3 py-2.5 text-sm text-white focus:border-purple-500 focus:outline-none"></textarea>
      </label>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="saveJournalEntry()" class="tap-scale rounded-2xl bg-gradient-to-r from-purple-600 to-blue-600 px-4 py-3 text-sm font-bold text-white shadow-lg shadow-purple-500/20">Save entry</button>
        <button onclick="loadSelectedDateEntry()" class="tap-scale rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-bold text-white">Load date</button>
      </div>
    </section>

    <section class="glass-card rounded-[28px] p-4">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="text-sm font-bold text-neutral-200">Recent notes</h3>
        <span id="journal-list-count" class="text-[10px] text-neutral-500">0 items</span>
      </div>
      <div id="journal-list" class="space-y-2"></div>
    </section>
  </div>

  <nav class="glass-nav fixed bottom-0 left-0 right-0 z-40 mx-auto max-w-md" style="padding-bottom: max(var(--sab), 14px);">
    <div class="flex items-center justify-around px-6 pt-2.5">
      <a href="index.html" class="tap-scale flex flex-col items-center text-purple-300">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11.5L12 5l8 6.5"></path>
          <path d="M6.5 9.5V19h11v-9.5"></path>
        </svg>
        <span class="mt-0.5 text-[10px] font-medium">Home</span>
      </a>

      <div class="-top-5 relative">
        <button onclick="resetJournalForm()" class="tap-scale flex h-14 w-14 items-center justify-center rounded-full border-2 border-[#121420] bg-gradient-to-tr from-purple-600 to-blue-500 text-white shadow-lg shadow-purple-500/25">
          <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        </button>
      </div>

      <button onclick="document.getElementById('journal-entry').focus()" class="tap-scale flex flex-col items-center text-neutral-400">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 3h5v5M8 16L21 3M5 5a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-6"/></svg>
        <span class="mt-0.5 text-[10px] font-medium">Write</span>
      </button>
    </div>
  </nav>

  <div id="toast" class="pointer-events-none fixed left-1/2 top-5 z-50 -translate-x-1/2 rounded-full border border-white/10 bg-neutral-900/90 px-4 py-2 text-xs font-semibold text-white opacity-0 shadow-xl transition-all duration-300">
    <span id="toast-icon">✓</span>
    <span id="toast-msg" class="ml-2">Saved</span>
  </div>

  <script>
    const STORAGE_KEY_JOURNAL = 'aura_journal_entries_v1';
    const journalEntries = {};
    let customJournalFrom = '';
    let customJournalTo = '';
    let selectedMood = 'calm';

    const MOOD_THEMES = {
      happy: { label: 'Happy', emoji: '😊', color: '#34d399', soft: 'rgba(52,211,153,0.14)', border: 'rgba(52,211,153,0.28)' },
      calm: { label: 'Calm', emoji: '😌', color: '#60a5fa', soft: 'rgba(96,165,250,0.14)', border: 'rgba(96,165,250,0.28)' },
      focused: { label: 'Focused', emoji: '🎯', color: '#a78bfa', soft: 'rgba(167,139,250,0.14)', border: 'rgba(167,139,250,0.28)' },
      grateful: { label: 'Grateful', emoji: '🙏', color: '#fbbf24', soft: 'rgba(251,191,36,0.14)', border: 'rgba(251,191,36,0.28)' },
      tired: { label: 'Tired', emoji: '😴', color: '#fb7185', soft: 'rgba(251,113,133,0.14)', border: 'rgba(251,113,133,0.28)' },
      overwhelmed: { label: 'Overwhelmed', emoji: '💭', color: '#f472b6', soft: 'rgba(244,114,182,0.14)', border: 'rgba(244,114,182,0.28)' }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById('journal-date');
      if (dateInput) dateInput.value = today;

      bindMoodButtons();
      setMood('calm');
      loadJournalStorage();
      renderJournalList();
      renderJournalSummary();
    });

    function normalizeJournalEntry(rawValue) {
      if (typeof rawValue === 'string') {
        return { text: rawValue, mood: 'calm' };
      }

      if (rawValue && typeof rawValue === 'object') {
        return {
          text: rawValue.text || '',
          mood: rawValue.mood || 'calm'
        };
      }

      return { text: '', mood: 'calm' };
    }

    function getJournalText(entry) {
      const normalized = normalizeJournalEntry(entry);
      return normalized.text || '';
    }

    function getJournalMood(entry) {
      const normalized = normalizeJournalEntry(entry);
      return normalized.mood && MOOD_THEMES[normalized.mood] ? normalized.mood : 'calm';
    }

    function updateMoodButtons() {
      const buttons = document.querySelectorAll('.mood-button');
      buttons.forEach(button => {
        const mood = button.dataset.mood;
        const isActive = mood === selectedMood;
        button.classList.toggle('active', isActive);
        button.style.borderColor = isActive ? MOOD_THEMES[mood].border : 'rgba(255,255,255,0.08)';
        button.style.background = isActive ? MOOD_THEMES[mood].soft : 'rgba(255,255,255,0.035)';
      });
    }

    function setMood(mood) {
      selectedMood = MOOD_THEMES[mood] ? mood : 'calm';
      updateMoodButtons();
    }

    function bindMoodButtons() {
      const moodButtons = document.querySelectorAll('.mood-button');
      moodButtons.forEach(button => {
        button.addEventListener('click', () => {
          setMood(button.dataset.mood);
        });
      });
    }

    function loadJournalStorage() {
      const raw = localStorage.getItem(STORAGE_KEY_JOURNAL);
      if (!raw) {
        const today = new Date().toISOString().split('T')[0];
        journalEntries[today] = { text: 'Today was productive. I finished the important tasks and kept my focus on what matters most.', mood: 'calm' };
        saveJournalStorage();
        return;
      }

      try {
        const parsed = JSON.parse(raw);
        Object.entries(parsed).forEach(([dateKey, value]) => {
          journalEntries[dateKey] = normalizeJournalEntry(value);
        });
      } catch (error) {
        console.warn('Unable to parse journal entries', error);
      }
    }

    function saveJournalStorage() {
      localStorage.setItem(STORAGE_KEY_JOURNAL, JSON.stringify(journalEntries));
    }

    function saveJournalEntry() {
      const dateInput = document.getElementById('journal-date');
      const textInput = document.getElementById('journal-entry');
      const selectedDate = dateInput.value || new Date().toISOString().split('T')[0];
      const text = textInput.value.trim();

      if (!text) {
        showToast('Please write a journal note before saving', '⚠️');
        textInput.focus();
        return;
      }

      journalEntries[selectedDate] = { text, mood: selectedMood };
      saveJournalStorage();
      renderJournalList();
      renderJournalSummary();
      showToast(`${MOOD_THEMES[selectedMood].emoji} Mood saved`, '✓');
    }

    function loadSelectedDateEntry() {
      const dateInput = document.getElementById('journal-date');
      const textInput = document.getElementById('journal-entry');
      const selectedDate = dateInput.value || new Date().toISOString().split('T')[0];
      const entry = journalEntries[selectedDate] || { text: '', mood: 'calm' };
      textInput.value = getJournalText(entry);
      setMood(getJournalMood(entry));
      showToast('Entry loaded', '📖');
    }

    function resetJournalForm() {
      const dateInput = document.getElementById('journal-date');
      const textInput = document.getElementById('journal-entry');
      dateInput.value = new Date().toISOString().split('T')[0];
      textInput.value = '';
      setMood('calm');
      textInput.focus();
    }

    function quickJournalPrompt(promptText) {
      const textInput = document.getElementById('journal-entry');
      if (!textInput) return;

      const current = textInput.value.trim();
      const nextValue = current ? `${current}\n\n${promptText}` : promptText;
      textInput.value = nextValue;
      textInput.focus();
    }

    function deleteJournalEntry(dateKey) {
      if (!journalEntries[dateKey]) return;
      if (!window.confirm('Delete this journal entry for ' + dateKey + '?')) {
        return;
      }
      delete journalEntries[dateKey];
      saveJournalStorage();
      renderJournalList();
      renderJournalSummary();
      showToast('Entry deleted', '🗑️');
    }

    function applyDateFilter() {
      const from = document.getElementById('journal-from').value;
      const to = document.getElementById('journal-to').value;

      customJournalFrom = from || '';
      customJournalTo = to || '';

      if (customJournalFrom && customJournalTo && customJournalFrom > customJournalTo) {
        const temp = customJournalFrom;
        customJournalFrom = customJournalTo;
        customJournalTo = temp;
        document.getElementById('journal-from').value = customJournalFrom;
        document.getElementById('journal-to').value = customJournalTo;
      }

      renderJournalList();
    }

    function clearDateFilter() {
      customJournalFrom = '';
      customJournalTo = '';
      document.getElementById('journal-from').value = '';
      document.getElementById('journal-to').value = '';
      renderJournalList();
    }

    function getFilteredJournalEntries() {
      const entries = Object.entries(journalEntries).sort((a, b) => b[0].localeCompare(a[0]));

      return entries.filter(([dateKey, entry]) => {
        const note = getJournalText(entry);
        if (!note || !note.trim()) return false;

        if (customJournalFrom || customJournalTo) {
          if (customJournalFrom && dateKey < customJournalFrom) return false;
          if (customJournalTo && dateKey > customJournalTo) return false;
          return true;
        }

        return true;
      });
    }

    function renderJournalList() {
      const list = document.getElementById('journal-list');
      const count = document.getElementById('journal-list-count');
      const filtered = getFilteredJournalEntries();

      if (!list || !count) return;
      count.innerText = `${filtered.length} item${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="rounded-2xl border border-dashed border-white/10 bg-neutral-900/60 p-5 text-center text-[11px] text-neutral-500">
            No journal entries match the selected date range. Save a note to begin your daily record.
          </div>
        `;
        return;
      }

      list.innerHTML = filtered.map(([dateKey, entry]) => {
        const moodKey = getJournalMood(entry);
        const mood = MOOD_THEMES[moodKey];
        const text = getJournalText(entry);
        const safeText = text.replace(/</g, '&lt;');

        return `
          <div class="journal-card p-3" style="background: linear-gradient(135deg, ${mood.soft}, rgba(15, 17, 25, 0.92)); border-color: ${mood.border}; --mood-color: ${mood.color};">
            <span class="mood-bar"></span>
            <div class="relative z-10">
              <div class="mb-2 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="text-[10px] font-semibold uppercase tracking-[0.16em] text-white/80">
                    ${new Date(dateKey + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                  </span>
                </div>
                <button onclick="deleteJournalEntry('${dateKey}')" class="tap-scale text-[10px] text-red-300">Delete</button>
              </div>
              <div class="mb-2 flex items-center justify-between">
                <span class="inline-flex items-center gap-1 rounded-full border px-2 py-1 text-[9px] font-semibold uppercase tracking-[0.14em]" style="background: ${mood.soft}; border-color: ${mood.border}; color: ${mood.color};">
                  ${mood.emoji} ${mood.label}
                </span>
              </div>
              <button onclick="openEntryForDate('${dateKey}')" class="w-full text-left">
                <p class="text-sm leading-6 text-neutral-100">${safeText.slice(0, 240)}${safeText.length > 240 ? '...' : ''}</p>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderJournalSummary() {
      const count = document.getElementById('journal-count');
      const latest = document.getElementById('journal-latest-text');
      const badge = document.getElementById('journal-badge');

      const entries = Object.entries(journalEntries).sort((a, b) => b[0].localeCompare(a[0]));
      const total = entries.length;
      if (count) count.innerText = total;

      if (entries.length === 0) {
        if (latest) latest.innerText = 'Your latest thoughts will appear here.';
        if (badge) badge.innerText = 'Ready';
        return;
      }

      const [latestDate, latestEntry] = entries[0];
      const latestText = getJournalText(latestEntry);
      const latestMood = getJournalMood(latestEntry);
      if (latest) {
        latest.innerText = `${new Date(latestDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}: ${latestText.slice(0, 95)}${latestText.length > 95 ? '...' : ''}`;
      }
      if (badge) {
        badge.innerText = `${MOOD_THEMES[latestMood].emoji} ${MOOD_THEMES[latestMood].label}`;
        badge.style.borderColor = MOOD_THEMES[latestMood].border;
        badge.style.background = MOOD_THEMES[latestMood].soft;
        badge.style.color = MOOD_THEMES[latestMood].color;
      }
    }

    function openEntryForDate(dateKey) {
      const dateInput = document.getElementById('journal-date');
      const textInput = document.getElementById('journal-entry');
      const entry = journalEntries[dateKey] || { text: '', mood: 'calm' };
      if (dateInput) dateInput.value = dateKey;
      if (textInput) textInput.value = getJournalText(entry);
      setMood(getJournalMood(entry));
      textInput.focus();
    }

    function showToast(msg, icon = '✓') {
      const toast = document.getElementById('toast');
      const iconEl = document.getElementById('toast-icon');
      const msgEl = document.getElementById('toast-msg');
      if (!toast || !iconEl || !msgEl) return;

      iconEl.innerText = icon;
      msgEl.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.add('opacity-0');
        toast.classList.remove('opacity-100');
      }, 2200);
    }
  </script>
</body>
</html>
